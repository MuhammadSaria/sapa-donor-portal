<template>
    <lightning-card title="Donation Summary">
        <div class="slds-m-around_medium">
        
            <lightning-input type="date" label="From Date" value={fromDate} onchange={handleFromDateChange}></lightning-input>
            <lightning-input type="date" label="To Date" value={toDate} onchange={handleToDateChange}></lightning-input>
            <br/>
            
            <lightning-button variant="brand" label="Generate PDF" onclick={handleSubmit}></lightning-button> &nbsp;

            <lightning-button variant="brand" label="Email PDF" onclick={sendEmail}></lightning-button>
        </div>
    </lightning-card>
</template>
