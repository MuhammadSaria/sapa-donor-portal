<template>
    <lightning-card>
        <div class="payment-container">

            <!-- Header -->
            <div class="payment-header">
                <div class="header-left">
                    <div class="header-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <rect x="2" y="5" width="20" height="14" rx="3" stroke="white" stroke-width="2"/>
                            <path d="M2 10h20" stroke="white" stroke-width="2"/>
                            <path d="M6 15h4" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="header-title">Stripe Secure Payment</h2>
                        <p class="header-sub">Enter your card details below</p>
                    </div>
                </div>
            </div>

            <div class="payment-body">

                <!-- Payment Method + Security Row -->
                <div class="method-row">
                    <div>
                        <p class="method-label">Payment Method:</p>
                        <p class="method-value">Credit / Debit Card</p>
                    </div>
                    <div class="security-row">
                        <div class="card-brands">
                            <div class="brand visa">VISA</div>
                            <div class="brand mc">
                                <svg viewBox="0 0 38 24" width="32" height="20">
                                    <circle cx="14" cy="12" r="7" fill="#eb001b"/>
                                    <circle cx="24" cy="12" r="7" fill="#f79e1b"/>
                                    <path d="M19 7.5a7 7 0 0 1 0 9 7 7 0 0 1 0-9z" fill="#ff5f00"/>
                                </svg>
                            </div>
                        </div>
                        <div class="ssl-badge">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="11" width="18" height="11" rx="2" stroke="#16a34a" stroke-width="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            <span>SSL Encrypted</span>
                        </div>
                    </div>
                </div>

                <!-- Card Details Label -->
                <label class="field-label">Card Details</label>

                <!-- ✅ Stripe Card Element Container -->
                <div class="card-element-wrapper">
                    <div class="card-element"></div>
                </div>

                <!-- Help Text -->
                <p class="help-text">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="10" stroke="#94a3b8" stroke-width="1.5"/>
                        <path d="M12 8v4M12 16h.01" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    Your payment information is secure and encrypted
                </p>

                <!-- Loading -->
                <template if:true={isLoading}>
                    <div class="loading-wrap">
                        <lightning-spinner alternative-text="Processing..." size="small" variant="brand"></lightning-spinner>
                        <span class="loading-text">Processing your payment...</span>
                    </div>
                </template>

                <!-- Pay Button -->
                <template if:false={isLoading}>
                    <button class="pay-btn" onclick={handleSubmit}>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="11" width="18" height="11" rx="2" fill="white" fill-opacity="0.25"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Complete Payment
                    </button>
                </template>

                <!-- Footer -->
                <div class="footer">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
                    </svg>
                    <span>Secured by Stripe</span>
                    <span class="dot">•</span>
                    <span>PCI DSS compliant</span>
                    <span class="dot">•</span>
                    <span>256-bit SSL encryption</span>
                </div>

            </div>
        </div>
    </lightning-card>
</template>
