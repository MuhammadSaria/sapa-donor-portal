<template>
    <lightning-card title="Donation PDF">
       
  
    <div class="slds-m-around_medium ">
        <div class="slds-m-around_medium">
        
            <lightning-input type="date" label="From Date" value={fromDate} onchange={handleFromDateChange}></lightning-input>
            <lightning-input type="date" label="To Date" value={toDate} onchange={handleToDateChange}></lightning-input>
            <br/>
        </div>
        
        <br/>
        <br/>
            <!-- Button to trigger batch job -->
            <lightning-button label="Send Donation PDF" 
                onclick={handleSendReceipts}
                variant="brand"
                disabled={isProcessing}>
            </lightning-button>
       
        <template if:true={isProcessing}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>
            
        <!-- Display error message, if any -->
        <template if:true={errorMessage}>
            <div class="slds-text-color_error">
                {errorMessage}
            </div>
        </template>
        </div>
        
    </lightning-card>
</template>
