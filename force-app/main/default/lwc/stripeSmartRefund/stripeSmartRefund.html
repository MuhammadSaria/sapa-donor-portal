<template>
    <lightning-card class="refund-card">
        <div class="slds-p-around_medium">
            <template if:true={loading}>
                <div class="loading-container">
                    <lightning-spinner alternative-text="Loading record..." size="medium" class="loading-spinner"></lightning-spinner>
                    <p>Loading record details...</p>
                </div>
            </template>

            <template if:false={loading}>
                <div class="refund-details">
                    <div class="detail-row">
                        <span class="detail-label">
                            <lightning-icon icon-name="utility:moneybag" size="small"></lightning-icon>
                            Transaction/Subscription ID:
                        </span>
                        <span class="detail-value">{paymentId}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">
                            <lightning-icon icon-name="utility:currency" size="small"></lightning-icon>
                            {amountLabel}
                        </span>
                        <span class="detail-value">{displayAmount}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">
                            <lightning-icon icon-name="utility:check" size="small"></lightning-icon>
                            Refund Status:
                        </span>
                        <span class="detail-value">
                            <lightning-icon 
                                icon-name={iconName} 
                                size="small" 
                                class={iconClass}>
                            </lightning-icon>
                            {statusText}
                        </span>
                    </div>
                </div>

                <div class="refund-button-container">
                    <lightning-button
                        variant="brand"
                        label="Process Refund"
                        onclick={openModal}
                        disabled={isRefunded}
                        class="refund-button">
                    </lightning-button>
                </div>

                <template if:true={response}>
                    <div class="response-section">
                        <div class="response-title">
                            <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                            Response:
                        </div>
                        <div class="response-content">{response}</div>
                    </div>
                </template>
            </template>
        </div>

        <!-- Confirmation Modal -->
        <template if:true={showModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open confirm-modal">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">
                            <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
                            Confirm Refund
                        </h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>Are you sure you want to refund <span class="refund-amount-highlight">{confirmationAmount}</span> for this {recordType}?</p>
                        <p class="slds-text-color_weak">This action cannot be undone.</p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button variant="destructive" label="Confirm Refund" onclick={confirmRefund}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
